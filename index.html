<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunshine</title>
<meta name="description" content="Seguimiento diario personal.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF5D9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121027" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunshine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Figtree:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: una columna de teléfono (máx. 480px) con barra de pestañas fija abajo.
   La pantalla de hoy abre con el arco del sol: 24 horas, la ventana de alimentación en dorado y un sol en la hora actual.
   Tokens de la marca Sunshine (manual de marca). */
:root{
  --cielo:#FFF5D9; --papel:#FFFDF6; --arena:#F7E7B8; --linea:#E3D3A2; --borde:#8F7F4E;
  --tinta:#1F1A38; --tinta-2:#4A4463; --bruma:#6B6247;
  --sol:#FFB703; --sobre-sol:#1F1A38; --sol-claro:#FFE9A8; --amanecer:#F2701D; --brasa:#A63C06;
  --noche:#2A2560; --sobre-noche:#FFF5D9; --noche-claro:#E1DDF3;
  --f-display:Unbounded,"Trebuchet MS",system-ui,sans-serif;
  --f-texto:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-dato:"Spline Sans Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cielo:#121027; --papel:#1B1838; --arena:#25214A; --linea:#332F5E; --borde:#756FAD;
    --tinta:#FFF4DA; --tinta-2:#CFC8E6; --bruma:#A29CC4;
    --sol:#FFC83D; --sobre-sol:#1A1532; --sol-claro:#3D3413; --amanecer:#FF8B3D; --brasa:#FFAE70;
    --noche:#8F86E0; --sobre-noche:#121027; --noche-claro:#2A2658;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cielo:#121027; --papel:#1B1838; --arena:#25214A; --linea:#332F5E; --borde:#756FAD;
  --tinta:#FFF4DA; --tinta-2:#CFC8E6; --bruma:#A29CC4;
  --sol:#FFC83D; --sobre-sol:#1A1532; --sol-claro:#3D3413; --amanecer:#FF8B3D; --brasa:#FFAE70;
  --noche:#8F86E0; --sobre-noche:#121027; --noche-claro:#2A2658;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--cielo);color:var(--tinta);font-family:var(--f-texto);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled,input:disabled,textarea:disabled,select:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit}
.mono{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.dim{color:var(--bruma)}
.chico{font-size:13px}

.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
#screen{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
h2{font-weight:700;font-size:18px;line-height:1.3}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bruma)}
.conteo{font-size:13px;color:var(--tinta-2)}

/* Marca */
.top{display:flex;align-items:center;gap:8px;margin-bottom:-12px}
.top svg{width:30px;height:30px;flex:none}
.top span{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.01em}
.top .aj{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--linea);background:var(--papel);display:grid;place-items:center}
.top .aj svg{width:20px;height:20px;stroke:var(--tinta);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top .aj[aria-current="page"]{background:var(--sol);border-color:var(--tinta)}
.chk{display:flex;gap:12px;align-items:center;width:100%;background:transparent;border:0;padding:0;text-align:left}
.carril{display:flex;flex-direction:column;gap:8px}
.notas{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linea);padding-top:12px}
.cuaderno li{padding:10px 0;display:flex;flex-direction:column;gap:2px}
.cuaderno li + li{border-top:1px solid var(--linea)}
.cuaderno p{white-space:pre-wrap;overflow-wrap:anywhere}
.cuaderno .cita p{font-style:italic}
.sup{display:grid;grid-template-columns:46px 1fr auto;gap:4px 10px;align-items:center;padding:10px 14px}
.sup b{font-weight:600;overflow-wrap:anywhere}
.sup .ctl{grid-column:2;width:100%}
.av{display:flex;align-items:center;gap:8px}
.av .btn{min-width:44px;padding:8px 10px}
.av b{min-width:48px;text-align:center}
.tips li{font-size:13px;color:var(--tinta-2);padding-left:14px;position:relative}
.tips li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--sol);border:1px solid var(--tinta)}
.logo-t{stroke:var(--tinta);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.logo-s{fill:var(--sol);stroke:var(--tinta);stroke-width:4;stroke-linejoin:round}
.logo-p{fill:var(--tinta)}

.cab{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.cab-t{min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.cab1{display:flex;flex-direction:column;gap:2px}
.nav{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--borde);background:var(--papel);font-size:22px;line-height:1;display:grid;place-items:center}
.volver{align-self:center;border:1.5px solid var(--tinta);background:var(--sol);color:var(--sobre-sol);padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px}

.aviso{background:var(--arena);border-radius:12px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{border:1.5px solid var(--borde);background:var(--papel);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;min-height:38px;white-space:nowrap}
.btn-sol{background:var(--sol);border-color:var(--tinta);color:var(--sobre-sol)}
.btn-txt{border:0;background:transparent;color:var(--brasa);font-weight:700;font-size:13px;padding:8px 0;min-height:36px}
.vacio{background:var(--papel);border:1.5px dashed var(--borde);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Arco del día */
.arco svg{display:block;width:100%;height:auto;max-width:100%}
.a-noche{fill:none;stroke:var(--noche-claro);stroke-width:10;stroke-linecap:round}
.a-sol{fill:none;stroke:var(--sol);stroke-width:10;stroke-linecap:round}
.a-hz{stroke:var(--linea);stroke-width:1.5}
.a-tic{fill:var(--papel);stroke:var(--borde);stroke-width:1.5}
.a-tic.ok{fill:var(--tinta);stroke:var(--tinta)}
.a-disco{fill:var(--sol);stroke:var(--tinta);stroke-width:2}
.a-rayo{stroke:var(--tinta);stroke-width:2;stroke-linecap:round}
.a-t{font-family:var(--f-texto);font-weight:700;font-size:17px;fill:var(--tinta)}
.a-s{font-family:var(--f-dato);font-size:11.5px;fill:var(--tinta-2)}
.a-h{font-family:var(--f-dato);font-size:10px;fill:var(--bruma)}

/* Marca de cumplido: un sol */
.marca{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--borde);display:grid;place-items:center;background:transparent}
.marca.s{width:20px;height:20px}
.marca svg{width:13px;height:13px;opacity:0;stroke:var(--sobre-sol);fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.marca.s svg{width:11px;height:11px}
[aria-pressed="true"] > .marca{background:var(--sol);border-color:var(--tinta)}
[aria-pressed="true"] > .marca svg{opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--linea);background:var(--papel);border-radius:999px;padding:7px 12px 7px 8px;font-weight:600;font-size:13px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--sol-claro);border-color:var(--tinta)}

/* Rutina del día */
.etq{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brasa);margin-right:6px}
.etq.neutra{color:var(--bruma)}
.its{border-top:1px solid var(--linea)}
.its li + li{border-top:1px solid var(--linea)}
.it{width:100%;display:flex;gap:12px;align-items:flex-start;padding:9px 12px 9px 14px;background:transparent;border:0;text-align:left;min-height:42px}
.it-n{flex:1;min-width:0;display:flex;flex-direction:column}
.it-n small{font-size:13px;color:var(--tinta-2)}
.it-d{flex:none;font-size:12px;color:var(--tinta-2);padding-top:2px;text-align:right}
.acc{flex:none;border:0;border-left:1px solid var(--linea);background:transparent;padding:0 14px;font-weight:700;font-size:13px;color:var(--brasa)}

/* Detalle dentro de un bloque o tarjeta */
.det{border-top:1px solid var(--linea);padding:12px;display:flex;flex-direction:column;gap:12px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fila label{font-size:13px;font-weight:600;color:var(--tinta-2)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo > label{font-weight:700}
.ctl{border:1.5px solid var(--borde);background:var(--papel);border-radius:10px;padding:8px 10px;min-height:40px;min-width:0}
textarea.ctl{width:100%;resize:vertical}
.ctl.n{width:68px;text-align:center;font-family:var(--f-dato)}
.ctl.w{flex:1 1 150px}
.buscar{width:100%}
.ej{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.ej + .ej{border-top:1px solid var(--linea);padding-top:12px}
.ej b{font-weight:600}
.ej-i{display:flex;gap:6px;align-items:center}
.ej-i span{font-size:12px;color:var(--tinta-2)}
.ej small{grid-column:1 / -1;font-size:12px;color:var(--bruma)}
.hoy-toca{display:flex;flex-direction:column;gap:2px}
.hoy-toca strong{font-size:20px;font-weight:700;line-height:1.2}
.reg{font-size:13px;color:var(--tinta-2);display:flex;flex-direction:column;gap:4px}
.reg li{display:flex;gap:8px;justify-content:space-between}
.reg li span:last-child{flex:none;color:var(--bruma)}

/* Tarjetas de seguimiento */
.tarjeta{background:var(--papel);border:1.5px solid var(--linea);border-radius:16px;overflow:hidden}
.tarjeta.ok{border-color:var(--tinta)}
.tj-h{width:100%;display:flex;gap:12px;align-items:center;padding:12px;background:transparent;border:0;text-align:left}
.tarjeta.ok .tj-h{background:var(--sol-claro)}
.tj-h b{flex:1;min-width:0;font-weight:700;font-size:16px}
.tj-h span.m{flex:none;font-size:12px;color:var(--tinta-2)}
.medidor{height:10px;border-radius:999px;background:var(--noche-claro);overflow:hidden}
.medidor i{display:block;height:100%;background:var(--noche);border-radius:999px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.caps span{height:30px;border-radius:8px;border:1.5px solid var(--linea);display:grid;place-items:center;font-size:11px;color:var(--bruma)}
.caps .lleno{background:var(--sol);border-color:var(--tinta);color:var(--sobre-sol);font-weight:700}
.caps .act{border-color:var(--amanecer);color:var(--tinta);font-weight:700;border-width:2px}

/* Escalas 1 a 5 */
.escalas{display:flex;flex-direction:column;gap:12px}
.esc{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px}
.esc-l{font-weight:700}
.esc-b{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.esc-b button{height:40px;border-radius:10px;border:1.5px solid var(--borde);background:var(--papel);font-family:var(--f-dato);font-size:14px}
.esc-b button[aria-pressed="true"]{background:var(--noche);border-color:var(--noche);color:var(--sobre-noche);font-weight:500}
.esc-p{grid-column:2;display:flex;justify-content:space-between;font-size:11px;color:var(--bruma);margin-top:-6px}

/* Semana */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--papel);border:1.5px solid var(--linea);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-l{font-size:12px;color:var(--tinta-2)}
.tile-v{font-size:26px;font-weight:700;line-height:1.15}
.tile-s{font-size:12px;color:var(--bruma)}
.tabla-w{overflow-x:auto;background:var(--papel);border:1.5px solid var(--linea);border-radius:16px}
table.sem{width:100%;border-collapse:collapse;font-size:13px}
table.sem th,table.sem td{padding:7px 2px;text-align:center}
table.sem th[scope="row"]{text-align:left;font-weight:500;padding-left:12px}
table.sem thead th{font-weight:700;color:var(--tinta-2);font-size:12px;padding-top:8px}
table.sem thead button{background:transparent;border:0;border-radius:8px;padding:4px 2px;width:100%;display:flex;flex-direction:column;align-items:center;gap:1px}
table.sem thead .hoy{color:var(--brasa)}
table.sem tbody tr + tr th,table.sem tbody tr + tr td{border-top:1px solid var(--linea)}
.c{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%}
.c.si{background:var(--sol);border:2px solid var(--tinta)}
.c.si svg{width:10px;height:10px;stroke:var(--sobre-sol);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.c.no{border:2px solid var(--borde)}
.c.fut::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--linea)}
.c.na{color:var(--bruma)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tinta-2);align-items:center}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.pares{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.par{display:flex;flex-direction:column;gap:1px;min-width:0}
.par b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.par span{font-size:12px;color:var(--tinta-2)}
.graf-plot{position:relative;height:132px;display:grid;grid-template-columns:repeat(8,1fr);border-bottom:1.5px solid var(--borde)}
.graf-meta{position:absolute;left:0;right:0;height:1px;background:var(--linea)}
.graf-meta span{position:absolute;right:0;bottom:2px;font-size:11px;color:var(--bruma);background:var(--cielo);padding-left:4px}
.col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;background:transparent;border:0;padding:0}
.col-b{width:min(24px,62%);border-radius:4px 4px 0 0;background:var(--noche);opacity:.5}
.col[aria-pressed="true"] .col-b{opacity:1}
.col-v{position:absolute;left:0;right:0;font-size:11px;color:var(--tinta);text-align:center}
.graf-x{display:grid;grid-template-columns:repeat(8,1fr);font-size:11px;color:var(--bruma);text-align:center;margin-top:4px}
.nota{background:var(--arena);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.diario li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 14px;font-size:13px}
.diario li + li{border-top:1px solid var(--linea)}
.diario b{font-weight:700}

/* Listas */
.lista{background:var(--papel);border:1.5px solid var(--linea);border-radius:16px;overflow:hidden}
.lista > li + li{border-top:1px solid var(--linea)}
.item{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.item-t b{font-weight:700;overflow-wrap:anywhere}
.item-t small{font-size:13px;color:var(--tinta-2)}
.lk{font-size:13px;font-weight:700;text-decoration:none;color:var(--brasa);padding:8px 0}
.libro{padding:8px 8px 8px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.libro .item-t b{font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--arena);color:var(--tinta-2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.pill.curso i{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pill.listo{background:var(--sol);color:var(--sobre-sol);border:1.5px solid var(--tinta)}
.pill.listo i{background:currentColor}
.vision{background:var(--noche);color:var(--sobre-noche);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.vision .eyebrow{color:inherit;opacity:.8}
.vision h2{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.25;text-wrap:balance}
.vision li{font-family:var(--f-dato);font-size:13px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--arena);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:38px;font-weight:700;font-size:14px;padding:4px}
.seg button[aria-pressed="true"]{background:var(--papel);box-shadow:0 0 0 1.5px var(--tinta)}
.hito{display:flex;align-items:center;gap:10px;padding:10px 14px;justify-content:space-between}
.hito p{min-width:0;overflow-wrap:anywhere}
.hito button{flex:none;border:0;background:transparent;padding:6px 0}

/* Día plegado: una fila por momento. El sol marca todo el bloque; el nombre abre el detalle. */
.dia > li.ok{background:var(--sol-claro)}
.dia > li.sig{box-shadow:inset 4px 0 0 var(--amanecer)}
.fd-f{display:flex;align-items:stretch}
.fd-m{flex:none;width:50px;min-height:56px;display:grid;place-items:center;background:transparent;border:0;padding:0}
.fd-t{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:9px 12px 9px 0;background:transparent;border:0;text-align:left}
.fd-h{flex:none;width:42px;font-size:13px;color:var(--tinta-2)}
.fd-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fd-n b{font-weight:700;overflow-wrap:anywhere}
.fd-n small{font-size:13px;color:var(--tinta-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dia > li.sig .fd-n small,.fd-t[aria-expanded="true"] .fd-n small{white-space:normal}
.fd-c{flex:none;font-size:12px;color:var(--tinta-2)}
.chev{flex:none;width:16px;height:16px;stroke:var(--bruma);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[aria-expanded="true"] > .chev{transform:rotate(180deg)}
.fd-b{border-top:1px solid var(--linea);background:var(--papel)}
.mb + .mb{border-top:1px solid var(--linea)}
.mb-h{display:flex;gap:8px;align-items:baseline;padding:10px 12px 2px 14px;font-size:13px}
.mb-h b{font-weight:700}
.mb .its{border-top:0}
.mb-n{padding:0 12px 10px 46px;font-size:13px;color:var(--bruma)}
.mb-a{padding:0 12px 12px 46px}
.grupo-t{font-size:13px;font-weight:700}
.c.lib::after{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--linea)}
.cuota{font-size:12px;color:var(--bruma);margin-left:4px}
.cuota.ok{color:var(--tinta);font-weight:500}

<script>
/* Almacén de Sunshine: los datos viven en este teléfono (IndexedDB) y los archivos salen por la hoja de compartir.
   Expone window.sunshine.usar('db' | 'downloads') con la misma forma que la app ya usa. */
(function(){
'use strict';
var MEM = {}, subsDoc = {}, subsCol = [], idb = null;
function clon(o){ return JSON.parse(JSON.stringify(o)); }
function unir(t, p){ for (var k in p){ var v = p[k]; if (v && typeof v === 'object' && !Array.isArray(v)){ if (!t[k] || typeof t[k] !== 'object' || Array.isArray(t[k])) t[k] = {}; unir(t[k], v); } else t[k] = v; } return t; }
function abrir(){
  return new Promise(function(ok, mal){
    var r; try { r = indexedDB.open('sunshine', 1); } catch(e){ return mal(e); }
    r.onupgradeneeded = function(){ r.result.createObjectStore('docs'); };
    r.onsuccess = function(){ ok(r.result); };
    r.onerror = function(){ mal(r.error); };
    r.onblocked = function(){ mal(new Error('blocked')); };
  });
}
function cargar(){
  return new Promise(function(ok, mal){
    var tx = idb.transaction('docs', 'readonly'), st = tx.objectStore('docs'), rk = st.getAllKeys(), rv = st.getAll();
    tx.oncomplete = function(){ rk.result.forEach(function(k, i){ MEM[k] = rv.result[i]; }); ok(); };
    tx.onerror = tx.onabort = function(){ mal(tx.error); };
  });
}
function falla(e){ e = e || {}; return { code:e.name === 'QuotaExceededError' ? 'quota_exceeded' : 'unavailable', message:String(e.message || e.name || 'error') }; }
function guardar(path, val){
  return new Promise(function(ok, mal){
    var tx; try { tx = idb.transaction('docs', 'readwrite'); } catch(e){ return mal(falla(e)); }
    tx.objectStore('docs').put(val, path);
    tx.oncomplete = function(){ ok(); };
    tx.onerror = tx.onabort = function(){ mal(falla(tx.error)); };
  });
}
function snap(path){ var v = MEM[path]; return { id:path.slice(path.lastIndexOf('/') + 1), exists:v !== undefined, data:function(){ return v === undefined ? undefined : clon(v); } }; }
function cumple(v, w){
  var x = v == null ? undefined : v[w[0]], y = w[2];
  switch (w[1]){ case '==': return x === y; case '!=': return x !== y; case '>=': return x >= y; case '>': return x > y; case '<=': return x <= y; case '<': return x < y; default: return true; }
}
function consulta(c, ws, n){
  var pre = c + '/', ks = Object.keys(MEM).filter(function(k){ return k.indexOf(pre) === 0 && k.indexOf('/', pre.length) < 0 && ws.every(function(w){ return cumple(MEM[k], w); }); }).sort();
  if (n) ks = ks.slice(0, n);
  return { docs:ks.map(snap) };
}
function avisar(path){
  setTimeout(function(){
    (subsDoc[path] || []).slice().forEach(function(f){ try { f(snap(path)); } catch(e){ console.error(e); } });
    var c = path.slice(0, path.lastIndexOf('/'));
    subsCol.slice().forEach(function(s){ if (s.c === c){ try { s.f(consulta(s.c, s.w, s.n)); } catch(e){ console.error(e); } } });
  }, 0);
}
function escribir(path, val){ MEM[path] = val; avisar(path); return guardar(path, val); }
function docRef(path){
  return {
    get:function(){ return Promise.resolve(snap(path)); },
    set:function(d){ return escribir(path, clon(d)); },
    update:function(p){ return escribir(path, unir(MEM[path] === undefined ? {} : clon(MEM[path]), clon(p))); },
    onSnapshot:function(cb){
      (subsDoc[path] || (subsDoc[path] = [])).push(cb);
      setTimeout(function(){ cb(snap(path)); }, 0);
      return function(){ var a = subsDoc[path] || [], i = a.indexOf(cb); if (i >= 0) a.splice(i, 1); };
    }
  };
}
function query(c, ws, n){
  return {
    where:function(f, op, v){ return query(c, ws.concat([[f, op, v]]), n); },
    limit:function(k){ return query(c, ws, k); },
    get:function(){ return Promise.resolve(consulta(c, ws, n)); },
    doc:function(id){ return docRef(c + '/' + id); },
    onSnapshot:function(cb){
      var s = { c:c, w:ws, n:n, f:cb }; subsCol.push(s);
      setTimeout(function(){ cb(consulta(c, ws, n)); }, 0);
      return function(){ var i = subsCol.indexOf(s); if (i >= 0) subsCol.splice(i, 1); };
    }
  };
}
var db = { doc:docRef, collection:function(c){ return query(c, [], 0); } };

/* Reemplazo completo, para cargar un respaldo */
function reemplazar(mapa){
  return new Promise(function(ok, mal){
    var tx; try { tx = idb.transaction('docs', 'readwrite'); } catch(e){ return mal(falla(e)); }
    var st = tx.objectStore('docs'); st.clear();
    Object.keys(mapa).forEach(function(k){ st.put(mapa[k], k); });
    tx.oncomplete = function(){ MEM = clon(mapa); ok(); };
    tx.onerror = tx.onabort = function(){ mal(falla(tx.error)); };
  });
}

/* Archivos: hoja de compartir del teléfono si acepta archivos; si no, descarga normal */
var MIME = { json:'application/json', csv:'text/csv', ics:'text/calendar', txt:'text/plain' };
function bajar(blob, nombre){
  var u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = nombre; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  return Promise.resolve({ status:'saved' });
}
var archivos = {
  save:function(r){
    var ext = String(r.filename).split('.').pop().toLowerCase(), tipo = MIME[ext] || 'application/octet-stream';
    var blob = new Blob([r.data], { type:tipo }), file = null;
    try { file = new File([blob], r.filename, { type:tipo }); } catch(e){}
    var puede = false; try { puede = !!(file && navigator.canShare && navigator.canShare({ files:[file] })); } catch(e){}
    if (!puede) return bajar(blob, r.filename);
    return navigator.share({ files:[file] }).then(function(){ return { status:'saved' }; }, function(e){
      if (e && e.name === 'AbortError') return Promise.reject({ code:'declined', message:'cancelado' });
      return bajar(blob, r.filename);
    });
  }
};

var listo = abrir().then(function(d){ idb = d; return cargar(); }).then(function(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); } catch(e){}
  return true;
}, function(){ return false; });

window.sunshine = {
  usar:function(n){
    if (n === 'db') return listo.then(function(ok){ return ok ? db : null; });
    if (n === 'downloads') return Promise.resolve(archivos);
    return Promise.resolve(null);
  },
  reemplazar:function(mapa){ return listo.then(function(ok){ if (!ok) return Promise.reject({ code:'unavailable' }); return reemplazar(mapa); }); }
};
})();
</script>

/* Momentos: los bloques de la rutina agrupados en pocas anclas del día. Un momento es una fila en Hoy y un aviso en el calendario. */
function momentosT(t, recs){
  if (!t) return [];
  var ms = porHora(t.momentos || []).map(function(m){ return { id:m.id, hora:m.hora || '', titulo:m.titulo, aviso:m.aviso || m.titulo, sinAlarma:!!m.sinAlarma, cierre:!!m.cierre, bloques:[] }; });
  var bl = (t.bloques || []).slice();

  if (!ms.length) return porHora(bl).map(function(b){ return { id:'mb-' + b.id, hora:b.hora || '', titulo:b.titulo, aviso:b.titulo, sinAlarma:!!b.sinAlarma || b.tipo === 'entreno', cierre:false, bloques:[b] }; });
  bl.forEach(function(b){
    var i, c = null;
    for (i = 0; i < ms.length; i++) if (ms[i].id === b.m){ c = ms[i]; break; }
    if (!c) for (i = 0; i < ms.length; i++){ if (ms[i].sinAlarma && b.tipo !== 'entreno') continue; if (!c || !b.hora || ms[i].hora <= b.hora) c = ms[i]; }
    (c || ms[0]).bloques.push(b);
  });
  ms.forEach(function(m){ m.bloques = porHora(m.bloques); });

}
function momentosDe(f){ return momentosT(tipoDe(f), recsDe(f)); }
function itemsM(m){ var a = []; m.bloques.forEach(function(b){ itemsDe(b).forEach(function(x){ a.push(x); }); }); return a; }
function momentoHecho(m, pasos){ var its = itemsM(m); return its.filter(function(x){ return !x.op; }).every(function(x){ return pasos && pasos[x.id]; }) && its.some(function(x){ return pasos && pasos[x.id]; }); }
/* Franja de un control de la noche según el día de la semana (puede no tocar ese día, o tener hora alternativa) */
function franjaW(k, w){

  if (a.alt && (a.alt.dias || []).indexOf(w) >= 0 && OKH.test(a.alt.hora || '')) return { hora:a.alt.hora, hasta:OKH.test(a.alt.hasta || '') ? a.alt.hasta : '' };

}
function franjaDe(k, f){ return franjaW(k, parse(f).getDay()); }

}
function recupHechas(v){ var c = 0, f = v.ini; while (f <= v.fin){ var r = dia(f).recup; if (r && r.hecho) c++; f = addDays(f, 1); } return c; }

/* Cumplimiento: lo diario se cuenta por día; lo semanal (frec) se cuenta contra su cuota de la semana. */
function cumpl(f){ var hs = habitosDe(f).filter(function(h){ return !(h.frec > 0); }), d = dia(f), n = 0; hs.forEach(function(h){ if (d.habitos && d.habitos[h.id]) n++; }); return { hechos:n, total:hs.length }; }
function vecesSem(lun, id){ var n = 0, t = hoy(); for (var i = 0; i < 7; i++){ var f = addDays(lun, i); if (f > t) break; var d = dia(f); if (d.habitos && d.habitos[id]) n++; } return n; }
function registrado(f){
  var d = S.local[f] || S.days[f]; if (!d) return false;
  var k; for (k in (d.habitos||{})) if (d.habitos[k]) return true;
  for (k in (d.pasos||{})) if (d.pasos[k]) return true;
  return !!(d.energia || d.sueno || d.estres || d.lecturaMin || d.estudioMin || d.medMin || (d.biblia && d.biblia.length) || (d.lecturas && d.lecturas.length) || (d.recup && d.recup.hecho));
}
function semana(lun){
  var t = hoy(), h = 0, tot = 0, reg = 0, e = 0, dias = [], sem = [];
  for (var i = 0; i < 7; i++){
    var f = addDays(lun, i), fut = f > t, c = cumpl(f);
    if (!fut){ h += c.hechos; tot += c.total; e++; if (registrado(f)) reg++; }
    dias.push({ f:f, fut:fut });
  }
  /* En una semana en curso la cuota exige solo lo que ya no se puede dejar para después. */
  ((S.cfg && S.cfg.habitos) || []).forEach(function(hb){
    if (!(hb.frec > 0)) return;
    var n = vecesSem(lun, hb.id), hechos = Math.min(n, hb.frec), nec = Math.max(0, hb.frec - (7 - e));
    if (e){ h += hechos; tot += Math.max(nec, hechos); }
    sem.push({ id:hb.id, nombre:hb.nombre, n:n, frec:hb.frec, nec:nec });
  });
  return { lun:lun, dias:dias, hechos:h, total:tot, reg:reg, sem:sem, pct:(reg && tot) ? Math.round(100*h/tot) : null };

function racha(){ var f = hoy(), n = 0; if (!registrado(f)) f = addDays(f,-1); while (registrado(f) && n < 400){ n++; f = addDays(f,-1); } return n; }

function fechasDesc(){ var m = {}, k; for (k in S.days) m[k] = 1; for (k in S.local) m[k] = 1; return Object.keys(m).sort().reverse(); }

/* ---------- Guardado de días: un escritor a la vez por documento ---------- */
function mutate(f, patch, silencioso){
  var cur = clone(dia(f)); merge(cur, patch); cur.fecha = f; S.local[f] = cur;
  var q = Q[f] || (Q[f] = { patch:{}, timer:0, busy:false, reint:false });
  merge(q.patch, clone(patch));
  clearTimeout(q.timer); q.timer = setTimeout(function(){ flush(f); }, 450);
  if (!silencioso) render();
}
function flush(f){
  var q = Q[f]; if (!q || q.busy || vacio(q.patch) || !DB) return;
  var patch = q.patch; q.patch = {}; q.busy = true; clearTimeout(q.timer);
  var ref = DB.doc('dias/' + f);
  var completo = function(){ var b = clone(S.local[f] || dia(f)); b.fecha = f; return ref.set(b); };
  var p;
  if (S.daysLista && !S.days[f]) p = completo();
  else p = ref.update(patch).catch(function(e){ if (e && e.code === 'invalid_argument') return completo(); throw e; });
  p.then(function(){
    var base = clone(S.days[f] || { fecha:f }); merge(base, patch); S.days[f] = base;
    S.guardar = null; q.reint = false;
  }).catch(function(e){
    var pend = q.patch; q.patch = merge(patch, pend);
    if (e && e.code === 'unavailable' && !q.reint){ q.reint = true; q.timer = setTimeout(function(){ flush(f); }, 800 + Math.random()*1200); }
    else S.guardar = (e && e.code) || 'unavailable';
  }).then(function(){
    q.busy = false;
    if (vacio(q.patch)) delete S.local[f];
    else if (!S.guardar && !q.reint){ clearTimeout(q.timer); q.timer = setTimeout(function(){ flush(f); }, 300); }
    render();
  });
}

/* ---------- Documentos sueltos (planes, libros, metas) ---------- */

  var d = docE(path), cur = clone(d.l || d.v || {}); merge(cur, patch); d.l = cur;
  if (path === 'config/rutina') S.cfg = cur;
  if (!silencioso) render();
  if (!DB) return;

    var ref = DB.doc(path);
    if (d.existe) return ref.update(patch).catch(function(e){ if (e && e.code === 'invalid_argument') return ref.set(clone(d.l)); throw e; });
    return ref.set(clone(d.l)).then(function(){ d.existe = true; });
  }).then(function(){ d.pend--; d.falla = false; if (!d.pend){ d.v = d.l || d.v; d.l = null; if (path === 'config/rutina') S.cfg = d.v; } })
    .catch(function(e){ d.pend--; d.falla = true; S.guardar = (e && e.code) || 'unavailable'; render(); });
}
function alDoc(path, s){ var d = docE(path); d.lista = true; d.existe = s.exists; d.v = s.exists ? s.data() : null; if (!d.pend && !d.falla) d.l = null; }

  S.guardar = null;

  Object.keys(DOC).forEach(function(p){ var d = DOC[p]; if (d.falla && d.l && DB){ d.falla = false; d.pend++; d.cadena = DB.doc(p).set(clone(d.l)).then(function(){ d.pend--; d.existe = true; if (!d.pend){ d.v = d.l; d.l = null; } }).catch(function(e){ d.pend--; d.falla = true; S.guardar = (e && e.code) || 'unavailable'; render(); }); } });

  DB.doc('config/rutina').onSnapshot(function(s){ alDoc('config/rutina', s); S.cfgLista = true; S.cfg = docGet('config/rutina'); render(); }, mal);
  DB.collection('dias').where('fecha', '>=', minFecha()).onSnapshot(function(snap){
    var m = {}; snap.docs.forEach(function(x){ if (x.exists) m[x.id] = x.data(); });
    S.days = m; S.daysLista = true; render();
  }, mal);
  ['metas/estado','plan/entreno','plan/biblia','plan/alarmas','plan/recup','plan/respaldo'].forEach(function(p){ DB.doc(p).onSnapshot(function(s){ alDoc(p, s); render(); }, function(){}); });
  ['libros','cursos','hitos'].forEach(function(c){ DB.collection(c).onSnapshot(function(snap){ snap.docs.forEach(function(x){ alDoc(c + '/' + x.id, x); }); S.col[c] = true; render(); }, function(){ S.col[c] = true; render(); }); });
